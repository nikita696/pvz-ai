[project]
name = "pvz-ai"
version = "0.1.0"
description = "FastAPI and Gradio chat MVP for gpt-oss-120b."
requires-python = ">=3.12,<3.15"
dependencies = [
  "aiosqlite>=0.21,<1",
  "alembic>=1.17,<2",
  "asyncpg>=0.31,<1",
  "fastapi==0.136.1",
  "gradio==6.14.0",
  "httpx>=0.28,<1",
  "openai>=2.8,<3",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.11,<3",
  "python-dotenv>=1.1,<2",
  "SQLAlchemy[asyncio]>=2.0,<3",
  "uvicorn[standard]==0.46.0",
]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "e2e: browser-level smoke tests",
]
