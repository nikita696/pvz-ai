services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pvz_ai
      POSTGRES_USER: pvz_ai
      POSTGRES_PASSWORD: pvz_ai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvz_ai -d pvz_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      APP_ENV: development
      AUTO_CREATE_TABLES: "true"
      DATABASE_URL: postgresql+asyncpg://pvz_ai:pvz_ai@db:5432/pvz_ai
      LLM_PROVIDER: ${LLM_PROVIDER:-echo}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.groq.com/openai/v1}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-oss-120b}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      HF_TOKEN: ${HF_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    environment:
      WEBUI_NAME: pvz-ai
      WEBUI_AUTH: "false"
      ENABLE_OPENAI_API: "true"
      OPENAI_API_BASE_URL: http://app:8000/v1
      OPENAI_API_KEY: pvz-ai-local
    depends_on:
      - app
    ports:
      - "3000:8080"
    volumes:
      - open_webui_data:/app/backend/data

volumes:
  postgres_data:
  open_webui_data:
