name: CI/CD

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: pvz_ai
          POSTGRES_USER: pvz_ai
          POSTGRES_PASSWORD: pvz_ai
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pvz_ai -d pvz_ai"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      AUTO_CREATE_TABLES: "true"
      DATABASE_URL: postgresql+asyncpg://pvz_ai:pvz_ai@localhost:5432/pvz_ai
      LLM_PROVIDER: echo
      LLM_MODEL: echo-local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: python -m ruff check .
      - name: Format check
        run: python -m black --check .
      - name: Unit and API tests
        run: python -m pytest tests
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Start app
        run: |
          python -m uvicorn pvz_ai.main:app --host 127.0.0.1 --port 8000 &
          sleep 8
      - name: Playwright smoke
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
        run: python -m pytest e2e

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install Vercel CLI
        run: npm install -g vercel@50.28.0
      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - name: Build
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - name: Deploy
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
